<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Sem isso, o Chrome/Android nunca oferece "Instalar app" — o
         manifest é o que diz nome, ícones e "abre em tela cheia, sem
         barra de navegador" (display: standalone). -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons-pwa/icon-192.png" />
    <meta name="theme-color" content="#2a1252" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Cardápio (placeholder)</title>
    <!-- Aplica o tema ANTES do primeiro paint (sem flash). Mesma regra de src/lib/theme.ts:
         escolha salva > preferência do sistema. -->
    <script>
      (function () {
        try {
          var s = localStorage.getItem('cardapio-customer-theme');
          var dark = s ? s === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          var r = document.documentElement;
          if (dark) r.classList.add('dark');
          r.style.colorScheme = dark ? 'dark' : 'light';
          // Efeitos visuais: ?fx=lite|full|auto (salvo em localStorage). auto = lite em aparelho fraco.
          var q = new URLSearchParams(location.search).get('fx');
          if (q === 'lite' || q === 'full' || q === 'auto') localStorage.setItem('cardapio-fx', q);
          var pref = localStorage.getItem('cardapio-fx') || 'auto';
          var c = navigator.connection || {};
          var weak = (navigator.deviceMemory && navigator.deviceMemory <= 2) ||
                     (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4 && window.matchMedia('(pointer: coarse)').matches) ||
                     c.saveData === true;
          r.setAttribute('data-fx', pref === 'auto' ? (weak ? 'lite' : 'full') : pref);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
